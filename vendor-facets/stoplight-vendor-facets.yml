earns_nothing:
- feature: hosted-docs
  check: llms_txt_published
  why: >-
    No Stoplight page claims llms.txt generation, and Stoplight's own docs host returns 404 for /llms.txt.
- feature: prism
  check: examples_present
  why: >-
    Prism serves the examples a document already has (or generates them dynamically); it writes none into
    the contract.
- feature: style-guides
  check: rules_substantial
  why: >-
    A style guide kept inside the Platform is private; nothing is counted until the provider publishes
    the ruleset, and then the rules_present row applies.
out_of_reach:
  checks:
  - mcp_server
  - agent_skills
  - agent_card
  - well_known_published
  - change_log_present
  - sdk_count_1
  - cli_present
  - postman_present
  - contract_present
  note: >-
    Stoplight offers no agent-discovery surface, no changelog feature, no SDK or CLI generation and no
    collection export, and it documents a contract the provider already has.
unscored_practice:
- feature: spectral
  why: >-
    CI-enforced linting (the practice) is invisible to the score; only a published ruleset file and the
    fixed contract are read.
