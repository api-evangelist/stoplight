# Vendor facets — Stoplight (SmartBear). The Stoplight Platform (design, hosted docs with try-it,
# style guides) plus its open-source tools: Spectral (the linter most catalog rulesets are
# written for), Prism (mock server) and Elements (docs components). Its reach is governance and
# contract hygiene through Spectral, and a conventional docs surface; it ships no llms.txt, MCP,
# skills or agent card, and its own docs site returns 404 for llms.txt.
vendor: stoplight
name: Stoplight
website: https://stoplight.io
areas:
- documentation
registry_keys:
- stoplight
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Stoplight's distinctive lift is Spectral: its OpenAPI ruleset flags missing info contact and description,
  operation descriptions, tags, operationIds, success responses and servers, which is a real route into
  Contract Quality, and a published Spectral ruleset is exactly what rules_present reads. The hosted docs
  add the usual reference, try-it and quick-start pointers. Every one of those needs the provider to act
  (fix the flagged spec, publish the ruleset, declare the pointers), and Stoplight contributes nothing
  to Agent Readiness beyond a code-sample link fallback; no llms.txt, MCP server, skills or agent card
  are offered.
features:
- id: hosted-docs
  name: Hosted API documentation and developer hub
  description: >-
    Documentation generated from OpenAPI and kept in sync, with Markdown guides, hub-wide search, theming
    and public or private access.
  source: https://stoplight.io/api-documentation
  tier: unknown
- id: try-it
  name: Embedded try-it-out
  description: Readers try API endpoints from within the published documentation.
  source: https://stoplight.io/api-documentation
  tier: unknown
- id: code-samples
  name: Generated code samples
  description: Request samples in curl, Python, Ruby, Java and other languages beside each operation.
  source: https://stoplight.io/api-documentation
  tier: unknown
- id: guides
  name: Quick-start guides and tutorials
  description: Markdown quick starts, tutorials and reference pages published alongside the API reference.
  source: https://stoplight.io/api-documentation
  tier: unknown
- id: style-guides
  name: Platform style guides
  description: >-
    Built-in or custom style guides (curated security and design rule sets) enforced across projects in
    the design workflow.
  source: https://stoplight.io/api-governance
  tier: paid
- id: spectral
  name: Spectral (open source)
  description: >-
    A ruleset engine for OpenAPI, AsyncAPI and JSON Schema that runs in the CLI, editors, CI and the Platform,
    with default OpenAPI and AsyncAPI rulesets to extend.
  source: https://stoplight.io/open-source/spectral
  tier: open-source
- id: spectral-oas-ruleset
  name: Spectral OpenAPI ruleset
  description: >-
    Built-in rules including info-contact, info-description, operation-description, operation-tags, operation-operationId(-unique),
    operation-success-response and oas3-api-servers.
  source: https://github.com/stoplightio/spectral/blob/develop/docs/reference/openapi-rules.md
  tier: open-source
- id: prism
  name: Prism mock server (open source)
  description: Mock HTTP servers generated from OpenAPI v2/v3 documents to prototype without code.
  source: https://stoplight.io/open-source/prism
  tier: open-source
- id: smartbear-stewardship
  name: Maintained by SmartBear
  description: SmartBear states it actively maintains Spectral and stewards Stoplight's API governance
    tooling.
  source: https://blog.stoplight.io/an-update-on-spectral-from-smartbear
  tier: unknown
