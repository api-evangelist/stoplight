billing:
  self_service: true
  docs: https://docs.stoplight.io/docs/platform/99abd4b3841fb-billing
  dashboard: https://stoplight.io/links/admin/billing
  trial_length_days: 14
  true_up: >-
    Stoplight runs a quarterly true-up on annual subscriptions so seats can be added
    mid-term; the true-up invoice date replaces the next-invoice date except in the
    fourth quarter of the annual cycle.
  roles_required:
    - owner
    - billing admin
    - admin
  interval_switching: Monthly and yearly subscriptions can be switched in the Billing Dashboard.
