description: >-
  Stoplight's published plans, read verbatim from https://stoplight.io/pricing on
  2026-08-27. This replaces the 2026-05-04 bulk-sweep scaffold, whose tiers and
  quotas were generated defaults. Stoplight prices per SEAT with an included-user
  allowance and a per-additional-user rate; it publishes NO API request quota,
  because there is no metered API product to meter.
currency: USD
billing_periods:
  - monthly
  - annual
pricing_model: per-seat
metered_api_usage: false
metered_note: >-
  Stoplight sells workspace seats and features, not API calls. No plan on the pricing
  page carries a request quota, an overage rate or a throughput limit.
plan_count: 5
plans:
  - id: stoplight-free
    name: Free
    type: free
    price: 0
    currency: USD
    users_included: 1
    projects: 1
    trial: null
    note: >-
      Listed in the plan-comparison table on the pricing page rather than as a
      purchase card. Plan price billed annually is shown as "–".
  - id: stoplight-basic
    name: Basic
    type: paid
    tagline: Design an API as an individual.
    price_annual: 44
    price_monthly: 56
    price_unit: per month
    currency: USD
    users_included: 3
    additional_user_annual: 11
    additional_user_monthly: 14
    trial: 14-day free trial
    features:
      - OpenAPI/JSON Schema visual designer
      - Interactive docs
      - Instant mock servers
  - id: stoplight-startup
    name: Startup
    type: paid
    tagline: Build an API program for small teams.
    price_annual: 113
    price_monthly: 147
