provider: Stoplight
providerId: stoplight
description: >-
  Cross-cutting runtime semantics for the Stoplight surfaces. Most of this file is a
  record of what is NOT documented: Stoplight is a design-first API tooling company
  that publishes almost no runtime contract for its own API.
