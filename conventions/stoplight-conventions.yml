idempotency:
  supported: false
  header: null
  scope: null
  retention: null
  evidence: >-
    No idempotency key, replay window or retry-safety guidance appears in the
    contract or anywhere in the published docs. The write surface includes
    PUT /versions/{versionId}/import, POST /versions/{versionId}/publish and
    PUT /versions/{versionId}/unpublish — PUT semantics make import/unpublish
    naturally idempotent, but Stoplight does not state that, and
    POST /versions/publish/anon is explicitly non-repeatable-safe (each call creates
    a new anonymous publication that cannot be updated or removed).
  note: >-
    Because nothing matching an idempotency contract exists, NO `Idempotency` pointer
    is wired into apis.yml.
