reversibility:
  grade: documented
  applies: true
  detail: >-
    Stoplight's platform API has one true reversal pair and one irreversible
    operation, and it states the irreversibility plainly while stating no window for
    the reversal.
  operations:
    - write_operation: POST /versions/{versionId}/publish
      operationId: POST_versions-versionId-publish
      reversal: PUT /versions/{versionId}/unpublish
      reversal_operationId: PUT_versions-versionId-unpublish
      window: null
      window_documented: false
      docs: openapi/stoplight-platform-v1-openapi.yml
      note: >-
        Publish/unpublish is a documented, symmetric reversal pair. No time limit is
        stated anywhere, so the reversal is `documented` rather than `verified`. Do
        NOT infer that it is unbounded.
    - write_operation: POST /versions/publish/anon
      operationId: POST_versions-publish-anon
      reversal: none
      window: null
      window_documented: false
      irreversible: true
      docs: openapi/stoplight-platform-v1-openapi.yml
      note: >-
        The provider's own operation description states the limitations verbatim:
        "Cannot update/remove the documentation". An anonymous publication is a
        one-way action with no reversal path — the single most important
        reversibility fact in this contract, and Stoplight does document it.
    - write_operation: PUT /versions/{versionId}/import
      operationId: PUT_versions-versionId-import
      reversal: none-documented
      window: null
      window_documented: false
      note: >-
        Import overwrites the version's specification content. No undo, restore or
        revision-rollback operation is described. Stoplight's Git-backed projects
        give a human branch history in the UI, but that is not an API reversal.
  grading_rationale: >-
    A reversal path exists and is documented (publish -> unpublish), but no window is
    stated for it, so this grades `documented` and not `verified`. No window was
    invented to close the gap.
