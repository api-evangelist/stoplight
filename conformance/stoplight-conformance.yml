domain_standard:
  market: API description / API governance tooling
  standard_family: OpenAPI Initiative specification family (OpenAPI, Arazzo, Overlay) + AsyncAPI + JSON Schema
  declared: true
  evidence: >-
    This is the rare case where the domain standard is not something the provider
    merely conforms to but the thing it builds on. Spectral declares built-in format
    support for OpenAPI v3.1/v3.0/v2.0, Arazzo v1.0 and AsyncAPI v2.x in its own
    documentation and in its npm package description; Prism consumes OpenAPI 2/3 and
    Postman Collections; Elements renders OpenAPI. Stoplight's own v1 contract
    declares openapi: 3.0.0 with servers[] https://api.stoplight.io/v1.
  spec_location: >-
    openapi/stoplight-platform-v1-openapi.yml (openapi: 3.0.0) and
    https://docs.stoplight.io/docs/spectral/d373afba57903-open-api-support
  note: >-
    Reward-only dimension. Recorded because the contract and the product docs BOTH
    declare the standard, not because the marketing site claims alignment.
