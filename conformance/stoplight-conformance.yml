description: >-
  Standards conformance for Stoplight. Two things are being measured and they are
  deliberately kept apart: what Stoplight's OWN API conforms to (thin), and what
  Stoplight's PRODUCTS implement as a matter of function (deep — this is a
  specification-tooling company, and its domain standard IS the API description
  specification family).
