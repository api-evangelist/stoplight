aid: stoplight
name: Stoplight
segments:
  - Documentation
description: >-
  Stoplight is a collaborative, design-first API platform that provides a visual
  editor for OpenAPI specifications, interactive hosted documentation, automatic
  mock servers, API style guides and governance, and open-source tools including
  Prism, Spectral, and Elements. Acquired by SmartBear in 2023, Stoplight enables
  teams to design, document, and govern APIs at scale.
type: Index
position: Consumer
access: 3rd-Party
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - API Design
  - API Governance
  - Documentation
  - Linting
  - Mock Servers
  - OpenAPI
  - Style Guides
created: '2026-03-03'
modified: '2026-03-16'
url: https://raw.githubusercontent.com/api-evangelist/stoplight/refs/heads/main/apis.yml
specificationVersion: '0.19'
apis:
  - aid: stoplight:stoplight-platform
    name: Stoplight Platform
    description: >-
      Stoplight Platform is a collaborative API design and documentation
      management tool that provides a visual editor for OpenAPI specifications,
      interactive hosted documentation, automatic mock servers, API style guides,
      governance features, and multi-branch Git integration. It enables teams to
      design, document, mock, and govern APIs using a design-first approach with
      no specialized knowledge required.
    humanURL: https://stoplight.io
    tags:
      - API Design
      - API Governance
      - Documentation
      - Mock Servers
      - OpenAPI
      - Style Guides
    properties:
      - type: Documentation
        url: https://docs.stoplight.io/
      - type: Portal
        url: https://stoplight.io
      - type: Pricing
        url: https://stoplight.io/pricing
      - type: GettingStarted
        url: https://docs.stoplight.io/docs/platform/vrjs3xapm31b7-stoplight-documentation
      - type: Sign Up
        url: https://stoplight.io/welcome
  - aid: stoplight:prism
    name: Stoplight Prism
    description: >-
      Prism is an open-source HTTP mock and proxy server that accelerates API
      development. It turns any OpenAPI v2 or v3 and Postman Collection file into
      a realistic API server with mocking, transformations, and validations,
      enabling frontend and backend teams to develop in parallel with hosted mock
      servers powered by API descriptions.
    humanURL: https://stoplight.io/open-source/prism
    tags:
      - API Testing
      - Mock Servers
      - Open Source
      - OpenAPI
      - Proxy
    properties:
      - type: Documentation
        url: https://docs.stoplight.io/docs/prism
      - type: GitHubRepository
        url: https://github.com/stoplightio/prism
  - aid: stoplight:spectral
    name: Stoplight Spectral
    description: >-
      Spectral is an open-source JSON and YAML linter for creating automated API
      style guides. It provides baked-in support for OpenAPI v3.1, v3.0, and v2.0,
      Arazzo v1.0, and AsyncAPI v2.x, enabling teams to automate validation and
      enforce consistent API design standards across their organization.
    humanURL: https://stoplight.io/open-source/spectral
    tags:
      - API Governance
      - AsyncAPI
      - Linting
      - Open Source
      - OpenAPI
      - Style Guides
    properties:
      - type: Documentation
        url: https://docs.stoplight.io/docs/spectral
      - type: GitHubRepository
        url: https://github.com/stoplightio/spectral
  - aid: stoplight:elements
    name: Stoplight Elements
    description: >-
      Elements is an open-source tool for building beautiful, interactive API
      documentation with embeddable React or Web Components, powered by OpenAPI
      and Markdown. It offers highly customizable and interactive embeddable web
      documentation to enhance user experience and developer engagement.
    humanURL: https://stoplight.io/open-source/elements
    tags:
      - Documentation
      - Open Source
      - OpenAPI
      - React
      - Web Components
    properties:
      - type: Documentation
        url: https://docs.stoplight.io/docs/elements
      - type: GitHubRepository
        url: https://github.com/stoplightio/elements
  - aid: stoplight:studio
    name: Stoplight Studio
    description: >-
      Stoplight Studio is the modern editor for API design and technical writing.
      It provides a visual, form-based editor for creating and editing OpenAPI v2
      and v3 specifications, with full validation, mocking, and modeling support.
      Studio includes a built-in Markdown editor, image manager, and the ability
      to publish documentation to the Stoplight documentation platform.
    humanURL: https://stoplight.io/api-design
    tags:
      - API Design
      - Editor
      - OpenAPI
      - Technical Writing
    properties:
      - type: Documentation
        url: https://docs.stoplight.io/docs/studio
      - type: GitHubRepository
        url: https://github.com/stoplightio/studio
