description: >-
  Rate limits for Stoplight, searched 2026-08-27. Stoplight publishes NONE. This file
  replaces the 2026-05-04 bulk-sweep scaffold, which asserted per-tier quotas,
  X-RateLimit-* headers and 429 semantics that Stoplight has never documented — those
  invented values are removed rather than carried forward.
limit_count: 0
documented: false
headers: {}
response_codes: {}
limits: []
searched:
  - surface: docs.stoplight.io platform project (all 100+ articles enumerated via the table-of-contents API)
    result: no rate limit, quota, throttling or 429 reference
  - surface: docs.stoplight.io FAQ and Troubleshooting
    result: no occurrence of "rate limit", "quota", "throttl" or "429"
  - surface: https://stoplight.io/pricing and the full plan-comparison table
    result: seat-based limits only; no request quota, no overage, no throughput cap
  - surface: openapi/stoplight-platform-v1-openapi.yml
    result: no 429 response on any of the five operations; no rate-limit headers described
  - surface: https://docs.stoplight.io/docs/prism/cfa6f7191e544-errors
    result: 14 documented Prism error codes, none of them a rate-limit or throttling error
note: >-
  An honest zero. Stoplight's commercial model is per-seat, not per-call, so there is
  no metered API surface for a limit to apply to. The one place a consumer might meet
  throttling is the hosted mock servers, where Stoplight's guidance is qualitative
  rather than numeric: it recommends running a standalone Prism proxy for CI/CD
  integrations "that result in a large number of API calls"
  (https://docs.stoplight.io/docs/platform/336b74db38c50-work-with-mock-servers).
  No number, window or header is attached to that advice.
agent_impact: >-
  An agent calling any Stoplight surface has no runtime signal to back off on — no
  X-RateLimit-*, no RateLimit-*, no Retry-After, and no documented exhaustion status.
